name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node 22's bundled npm 10.x crashes (arborist "edgesOut" null) on
          # the nested tests/ install; npm >=11 handles it.
          node-version: 24

      - name: Install dependencies
        # Lockfiles are gitignored in this repo, so npm ci is not possible here.
        # cd instead of --prefix: --prefix inside an npm script leaks
        # npm_config_prefix into the child install and breaks arborist.
        run: |
          npm install --no-audit --no-fund
          cd tests && npm install --no-audit --no-fund

      - name: Install ffmpeg
        # The codex STT transport tests exercise the real ffmpeg conversion
        # path (convertAudio); without the binary they fail with
        # "ffmpeg is required for transcription".
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run test suite
        run: npm test
        working-directory: tests
